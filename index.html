<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duck Race Game — Moises Salvador Elementary School</title>
<meta name="description" content="A classroom racing game for kindergarten pupils. Add names, race the ducks, and the winner answers a question.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<h1>Duck Race Game 🏁 Moises Salvador Elementary School</h1>

<input type="text" id="studentName" placeholder="Enter student name">
<button onclick="addStudent()">Add Student</button>

<div id="studentsList"></div>

<div class="race-controls">
    <button onclick="startRace()">🏁 Start Race</button>
    <button class="secondary" onclick="resetRace()">🔄 Race Again</button>
    <button class="danger" onclick="clearAll()">🗑️ Clear All</button>
</div>

<details id="questionEditor">
  <summary>📝 Manage questions</summary>

  <div class="question-editor-body">
    <input type="text" id="newQuestion" placeholder="Question — e.g. What is 2 + 3?">
    <input type="text" id="newAnswer" placeholder="Answer — e.g. 5">
    <button onclick="addQuestion()">Add question</button>

    <p id="questionCount"></p>
    <div id="questionList"></div>

    <button class="secondary" onclick="resetQuestions()">↺ Restore default questions</button>
  </div>
</details>

<div id="timer">⏱ 0s</div>

<div class="race-track" id="raceTrack">
    <div class="wave"></div>
    <div class="wave wave2"></div>
</div>

<div class="winner" id="winnerText"></div>

<div class="question-box" id="questionBox">
    <h3 id="questionText"></h3>
    <input type="text" id="answerInput" placeholder="Your Answer">
    <button onclick="checkAnswer()">Submit</button>
</div>

<div class="celebration" id="celebration">
    <div class="rainbow"></div>
    <div class="confetti-container"></div>
</div>

<audio id="victorySound" preload="auto">
    <source src="victory.mp3" type="audio/mpeg">
</audio>

<audio id="duckSound" preload="auto">
    <source src="duck.mp3" type="audio/mpeg">
</audio>

<script src="index.js"></script>
</body>
</html>
