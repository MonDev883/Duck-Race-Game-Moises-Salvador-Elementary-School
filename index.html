<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dock Race Game Moises Elementary School</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/3/33/Yellow_duck_icon.png" type="image/png">
<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<h1>Duck Race Game 🏁 Moises Salvador Elementary School</h1>

<input type="text" id="studentName" placeholder="Enter student name">
<button onclick="addStudent()">Add Student</button>
<div id="studentsList"></div>
<button onclick="startRace()">🏁 Start Race</button>

<div id="timer">⏱ 0s</div>

<div class="race-track" id="raceTrack">
    <div class="wave"></div>
    <div class="wave wave2"></div>
</div>

<div class="winner" id="winnerText"></div>

<div class="question-box" id="questionBox">
    <h3 id="questionText"></h3>
    <input type="text" id="answerInput" placeholder="Your Answer">
    <button onclick="checkAnswer()">Submit</button>
</div>

<div class="celebration" id="celebration">
    <div class="rainbow"></div>
    <div class="confetti-container"></div>
</div>

<audio id="victorySound" preload="auto">
    <source src="victory.mp3" type="audio/mpeg">
</audio>

<audio id="duckSound" preload="auto">
    <source src="duck.mp3" type="audio/mpeg">
</audio>

<script src="index.js"></script>
</body>
</html>
